name: DeckRender release acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub tag (empty means latest formal release)
        type: string
      mode:
        description: Debug selection or full formal acceptance
        type: choice
        options: [debug, formal]
        default: debug
      cloud_cases:
        description: Space-separated case IDs allowed cloud access in debug mode
        type: string
      max_cloud_calls:
        description: Optional lower call limit (empty uses the frozen plan)
        type: string
      max_source_pages:
        description: Optional source-page submission limit (not credits)
        type: string
      force:
        description: Re-run an unchanged release
        type: boolean
        default: false
  schedule:
    - cron: '43 6 * * 2' # 每周二北京时间 14:43 (UTC 06:43)
env:
  REN_ALLOW_SUDO_NETNS: '1' # Create network namespace, then drop back to runner UID
  REN_RUN_MODE: ${{ github.event_name == 'schedule' && 'formal' || inputs.mode || 'debug' }}
permissions:
  contents: read
concurrency:
  group: deckrender-release-acceptance
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmark/acceptance/requirements.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r benchmark/acceptance/requirements.txt
      - name: Require reviewed public snapshot
        run: python benchmark/scripts/release_acceptance.py snapshot validate --snapshot ci-input/current
      - name: Restore processed fingerprint
        run: |
          mkdir -p benchmark/artifacts/acceptance
          git fetch origin acceptance-results || true
          git show origin/acceptance-results:state.json > benchmark/artifacts/acceptance/last-attempted.json || rm -f benchmark/artifacts/acceptance/last-attempted.json
      - name: Include new audit evidence in change detection
        run: |
          git fetch origin acceptance-cloud || true
          if git show-ref --verify --quiet refs/remotes/origin/acceptance-cloud; then
            git archive origin/acceptance-cloud cloud | tar -x -C benchmark/artifacts/acceptance
          fi
      - id: change
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_RUN: ${{ inputs.force || github.event_name == 'push' || github.event_name == 'schedule' || inputs.mode == 'debug' }}
          REN_ALLOW_CLOUD: ${{ vars.REN_ALLOW_CLOUD }}
          REN_AUDIT_COMMAND: ${{ vars.REN_AUDIT_COMMAND }}
          REN_LIFECYCLE_COMMAND: ${{ vars.REN_LIFECYCLE_COMMAND }}
          DECKRENDER_API_KEY: ${{ secrets.DECKRENDER_API_KEY }}
          DECKRENDER_API_KEY_2: ${{ secrets.DECKRENDER_API_KEY_2 }}
          DECKRENDER_EXHAUSTED_API_KEY: ${{ secrets.DECKRENDER_EXHAUSTED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmark/scripts/ci_driver.py check --snapshot ci-input/current
      - if: steps.change.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python benchmark/scripts/ci_driver.py freeze
      - if: steps.change.outputs.changed == 'true'
        run: tar -czf frozen.tgz benchmark/artifacts/acceptance/releases benchmark/artifacts/acceptance/active-release.json benchmark/artifacts/acceptance/last-check.json
      - if: steps.change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-release
          path: frozen.tgz
          retention-days: 14
  verify:
    needs: freeze
    if: needs.freeze.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmark/acceptance/requirements.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm global directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pip install -r benchmark/acceptance/requirements.txt
      - name: Install execution and privacy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 util-linux strace fonts-liberation fonts-noto-cjk ffmpeg tesseract-ocr
      - uses: actions/download-artifact@v4
        with:
          name: frozen-release
      - run: |
          tar -xzf frozen.tgz
          python benchmark/scripts/release_acceptance.py restore-runtime
      - name: Restore cloud audit ledger
        run: |
          git fetch origin acceptance-cloud || true
          if git show-ref --verify --quiet refs/remotes/origin/acceptance-cloud; then
            git archive origin/acceptance-cloud cloud | tar -x -C benchmark/artifacts/acceptance
          fi
      - name: Execute complete checklist with shared cloud budget
        env:
          REN_ALLOW_CLOUD: ${{ github.event_name != 'push' && vars.REN_ALLOW_CLOUD || '0' }}
          REN_DEBUG_CLOUD_CASES: ${{ inputs.cloud_cases }}
          REN_MAX_CLOUD_CALLS: ${{ inputs.max_cloud_calls || vars.REN_MAX_CLOUD_CALLS }}
          REN_MAX_SOURCE_PAGES: ${{ inputs.max_source_pages || vars.REN_MAX_SOURCE_PAGES }}
          DECKRENDER_API_KEY: ${{ secrets.DECKRENDER_API_KEY }}
          DECKRENDER_API_KEY_2: ${{ secrets.DECKRENDER_API_KEY_2 }}
          DECKRENDER_EXHAUSTED_API_KEY: ${{ secrets.DECKRENDER_EXHAUSTED_API_KEY }}
        run: python benchmark/scripts/ci_execute.py
      - name: Archive complete group evidence
        if: always()
        run: tar -czf result.tgz -C benchmark/artifacts/acceptance/runs .
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-groups
          path: result.tgz
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: [freeze, verify]
    if: always() && needs.freeze.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmark/acceptance/requirements.txt'
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: incoming
      - run: pip install -r benchmark/acceptance/requirements.txt
      - name: Restore complete group evidence
        run: |
          for archive in incoming/result-*/result.tgz; do
            tar -xzf "$archive" -C "$(dirname "$archive")"
          done
      - run: python benchmark/scripts/release_acceptance.py aggregate --snapshot ci-input/current --inputs incoming --run-id '${{ github.run_id }}'
      - name: Archive complete aggregate evidence
        run: tar -czf aggregate.tgz -C benchmark/artifacts/acceptance/runs '${{ github.run_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-report
          path: aggregate.tgz
  persist-and-pages:
    needs: aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'benchmark/acceptance/requirements.txt'
      - uses: actions/download-artifact@v4
        with:
          name: aggregate-report
      - name: Restore complete aggregate evidence
        run: |
          mkdir -p benchmark/artifacts/acceptance/runs
          tar -xzf aggregate.tgz -C benchmark/artifacts/acceptance/runs
      - uses: actions/download-artifact@v4
        with:
          name: frozen-release
      - run: tar -xzf frozen.tgz
      - name: Prepare history branch
        run: |
          git fetch origin acceptance-results || true
          if git show-ref --verify --quiet refs/remotes/origin/acceptance-results; then
            git worktree add history origin/acceptance-results
          else
            mkdir history
            git -C history init -b acceptance-results
          fi
          python benchmark/scripts/release_acceptance.py publish --output history/site
          python benchmark/scripts/ci_driver.py record
          if test -f benchmark/artifacts/acceptance/last-attempted.json; then cp benchmark/artifacts/acceptance/last-attempted.json history/state.json; fi
      - name: Persist immutable reports and processed fingerprint
        run: |
          git -C history config user.name github-actions
          git -C history config user.email github-actions@users.noreply.github.com
          git -C history add site
          if test -f history/state.json; then git -C history add state.json; fi
          git -C history diff --cached --quiet || git -C history commit -m 'Archive DeckRender acceptance evidence'
          git -C history push "$GITHUB_WORKSPACE/.git" HEAD:refs/heads/acceptance-results
          git push origin acceptance-results
      - id: pages-config
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages-config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: history/site
      - if: steps.pages-config.outcome == 'success'
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Write published report links
        if: steps.pages-config.outcome == 'success' && steps.deployment.outcome == 'success'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from urllib.parse import quote
          run_id = quote("${{ github.run_id }}", safe='')
          base = os.environ.get('PAGES_URL', '').rstrip('/') + '/'
          print('## 📊 验收报告已发布到 GitHub Pages')
          print(f'\n- 🌐 [验收历史总览首页]({base})')
          print(f'- 📄 [本轮完整验收报告]({base}{run_id}/report.html)')
          print(f'- 🖼️ [本轮视觉图像对照工作台]({base}{run_id}/visual.html)')
          print(f'- 🤖 [本轮 Agent 机器分析报告]({base}{run_id}/agent-report.json)')
          PY
      - name: Report Pages Configuration Reminder
        if: steps.pages-config.outcome != 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          print('## ⚠️ GitHub Pages 尚未在仓库设置中启用')
          print('\n完整验收数据与静态网站已成功生成，并已归档推送至 `acceptance-results` 分支！')
          print('\n若需在 GitHub Pages 在线直接访问报告，请在仓库设置中开启 Pages：')
          print('1. 打开 [仓库设置 Settings -> Pages](https://github.com/kobebryantwt/deckrender-acceptance/settings/pages)')
          print('2. 在 **Build and deployment -> Source** 下拉框中选择 **GitHub Actions**')
          print('3. 切换完成后，后续每次自动化运行都将直接部署上线。')
          PY
  verdict:
    needs: [aggregate, persist-and-pages]
    if: always() && needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aggregate-report
      - name: Restore complete aggregate evidence
        run: |
          mkdir -p benchmark/artifacts/acceptance/runs
          tar -xzf aggregate.tgz -C benchmark/artifacts/acceptance/runs
      - run: python benchmark/scripts/release_acceptance.py verdict --run 'benchmark/artifacts/acceptance/runs/${{ github.run_id }}'
